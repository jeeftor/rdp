name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: bash scripts/install-build-deps.sh
      - name: Check code and launchers
        run: make check
      - name: Install pinned packager
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build client
        run: make build
      - name: Package client tarball, test DEB, and matching sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 2
            export PACKAGE_VERSION="${RELEASE_TAG#v}"
          fi
          make package
      - name: Test Wayland and X11 display backends
        run: bash tests/display-backends.sh
      - name: Test DEB upgrade, installed launchers, and removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-rc.1 --repo jeeftor/rdp --pattern '*.deb' --pattern SHA256SUMS --dir .build/upgrade-base
          (cd .build/upgrade-base && sha256sum --ignore-missing --check SHA256SUMS)
          sudo apt-get install -y ./.build/upgrade-base/*.deb
          freerdp-portable /version
          sudo apt-get install -y ./output/*.deb
          freerdp /version
          rdpctl --help
          test ! -e /usr/bin/freerdp-portable
          sudo apt-get remove -y freerdp-portable
          test ! -e /usr/bin/freerdp
          test ! -e /usr/bin/rdpctl
          test ! -e /opt/freerdp-portable
          dpkg-deb --info output/*.deb
      - name: Verify checksums and public artifact contents
        run: |
          (cd output && sha256sum --check SHA256SUMS)
          if find .build/freerdp-portable-* -type f \( -name '*.pem' -o -name '*.key' -o -name '*.args' \) | rg .; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freerdp-linux-x86_64
          if-no-files-found: error
          path: |
            output/*.tar.gz
            output/*.deb
            output/SHA256SUMS

  desktop:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/desktop.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freerdp-linux-x86_64
          path: output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rdpctl-desktop-linux-x86_64
          path: output
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd output && sha256sum --check SHA256SUMS)
          (cd output && sha256sum --check GUI-SHA256SUMS)
          mkdir publish
          cp "output/rdp-${RELEASE_TAG#v}.x86_64.rpm" "output/rdpctl-portable-${RELEASE_TAG#v}-sources.tar.gz" publish/
          (cd publish && sha256sum *.rpm *-sources.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" publish/*.rpm publish/*-sources.tar.gz publish/SHA256SUMS \
            --verify-tag --prerelease --title "$RELEASE_TAG" \
            --notes 'Install the single combined rdp RPM on RHEL 10 x86_64. It includes the GUI, FreeRDP, GTK3 and WebKitGTK runtime. The source archive includes matching client, GUI and bundled dependency sources. Verify SHA256SUMS before installation. Client and desktop builds and X11/Wayland tests pass before publication. Host graphics drivers and keyboard data remain required. Actual RHEL installation, RDP connections and physical multi-monitor behavior require target validation.'
