name: Desktop build
on:
  push:
    branches: ['**']
    paths: ['desktop/**', 'packaging/gui-nfpm.yaml', 'packaging/rdpctl-gui.desktop', 'scripts/package-gui.sh', 'scripts/*portable*.sh', 'packaging/portable*', 'packaging/AppImageKit-LICENSE', '.github/workflows/desktop.yml', 'Makefile']
  pull_request:
    paths: ['desktop/**', 'packaging/gui-nfpm.yaml', 'packaging/rdpctl-gui.desktop', 'scripts/package-gui.sh', 'scripts/*portable*.sh', 'packaging/portable*', 'packaging/AppImageKit-LICENSE', '.github/workflows/desktop.yml', 'Makefile']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install desktop build and test dependencies
        run: |
          bash scripts/install-build-deps.sh
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf pkg-config build-essential webkit2gtk-driver xvfb xauth weston gettext-base shellcheck dbus-x11 fonts-dejavu-core bubblewrap xdg-dbus-proxy rpm x11-utils apparmor
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: ${{ runner.os }}-rdpctl-rust-1.98.1-${{ hashFiles('desktop/Cargo.lock', 'desktop/patches/**') }}
      - name: Fetch matching client artifact for tagged releases
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freerdp-linux-x86_64
          path: .build/portable-input
      - name: Fetch verified client baseline for development builds
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-rc.4 --repo jeeftor/rdp --pattern 'freerdp-portable*' --pattern SHA256SUMS --dir .build/portable-input
      - name: Check and build desktop
        run: |
          bash desktop/tests/portable-notices.sh
          make gui-check
          shellcheck scripts/package-gui.sh desktop/tests/display-backends.sh
          cargo build --manifest-path desktop/Cargo.toml -p rdpctl-gui --locked
          make gui-build
          cargo test --manifest-path desktop/Cargo.toml -p rdpctl-gui --release --locked
          mkdir -p output
          cp desktop/target/release/rdpctl-gui output/rdpctl-gui
      - name: Install GUI test driver
        run: |
          cargo install tauri-driver --version 2.0.5 --locked
          curl --fail --location --retry 2 https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-x86_64-unknown-linux-gnu.tgz --output .build/tauri-cli.tgz
          echo '04ef3a9a2ed7b7dc479bef08ab40deee80065c99fc778f79ebce775eb72bbeff  .build/tauri-cli.tgz' | sha256sum --check
          tar -xzf .build/tauri-cli.tgz -C "$HOME/.cargo/bin" cargo-tauri
          cargo tauri --version
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test actual GUI under X11 and Wayland
        run: |
          bash desktop/tests/display-backends.sh desktop/target/debug/rdpctl-gui
      - name: Package desktop RPM, DEB and sources
        env:
          GOTOOLCHAIN: auto
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 2
            export PACKAGE_VERSION="${RELEASE_TAG#v}"
          fi
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          make gui-package
          make gui-portable-package
          bash desktop/tests/portable.sh
          (cd output && sha256sum --check GUI-SHA256SUMS)
          dpkg-deb --info output/rdpctl-gui*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rdpctl-desktop-linux-x86_64
          if-no-files-found: warn
          path: |
            output/rdpctl-gui*
            output/rdpctl-portable*
            output/rdp-*.rpm
            output/GUI-SHA256SUMS
            output/desktop-tests/
