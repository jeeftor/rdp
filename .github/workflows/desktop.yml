name: Desktop build
on:
  push:
    branches: ['**']
    paths: ['desktop/**', 'packaging/gui-nfpm.yaml', 'packaging/rdpctl-gui.desktop', 'scripts/package-gui.sh', '.github/workflows/desktop.yml', 'Makefile']
  pull_request:
    paths: ['desktop/**', 'packaging/gui-nfpm.yaml', 'packaging/rdpctl-gui.desktop', 'scripts/package-gui.sh', '.github/workflows/desktop.yml', 'Makefile']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install desktop build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf pkg-config build-essential webkit2gtk-driver xvfb xauth weston gettext-base shellcheck
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show
      - name: Check and build desktop
        run: |
          make gui-check
          shellcheck scripts/package-gui.sh desktop/tests/display-backends.sh
          make gui-build
      - name: Test actual GUI under X11 and Wayland
        run: |
          cargo install tauri-driver --version 2.0.5 --locked
          bash desktop/tests/display-backends.sh desktop/target/release/rdpctl-gui
      - name: Package desktop RPM, DEB and sources
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          make gui-package
          (cd output && sha256sum --check GUI-SHA256SUMS)
          dpkg-deb --info output/rdpctl-gui*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rdpctl-desktop-linux-x86_64
          if-no-files-found: warn
          path: |
            output/rdpctl-gui*
            output/GUI-SHA256SUMS
            output/desktop-tests/
